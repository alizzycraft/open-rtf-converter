name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-check:
    name: Format, check, and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Verify supported API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Run correctness, suspicious, and performance lints
        run: >-
          cargo clippy --all-targets --all-features --
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf

  core-tests:
    name: Core and conversion tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run library tests
        run: cargo test --lib

      - name: Run CLI tests
        run: cargo test --bin open-rtf-converter

      - name: Run conversion tests
        run: cargo test --test conversion

      - name: Run supported public API tests
        run: cargo test --test public_api

      - name: Run public API documentation tests
        run: cargo test --doc

      - name: Verify decomposed test inventory
        run: cargo test --test test_structure

  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run security tests
        run: |
          cargo test --lib security_tests::
          cargo test --test security

  reference-and-regression:
    name: Reference and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run reference fixture tests
        run: cargo test --test reference_fixtures

      - name: Run fuzz regression tests
        run: cargo test --test fuzz_regression

      - name: Compile all fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  fuzz-smoke:
    name: Bounded libFuzzer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the nightly fuzz toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked

      - name: Run bounded fuzz targets
        run: |
          cargo +nightly fuzz run rtf_lexer -- -runs=100
          cargo +nightly fuzz run rtf_parser -- -runs=100
          cargo +nightly fuzz run rtf_to_pdf_passive -- -runs=100

  wasm-core:
    name: WASM core and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the no-default-features WASM core
        run: cargo check --no-default-features --target wasm32-unknown-unknown

      - name: Run the WASM dependency policy test
        run: cargo test --test wasm_dependency_policy

  web:
    name: Angular website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix web

      - name: Run website tests
        run: npm test --prefix web -- --watch=false

      - name: Build the Angular application
        run: npm run build:angular --prefix web
